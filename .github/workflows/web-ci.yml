name: Web CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "web/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen install, data contract, build, and server smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact pnpm and Node.js
        uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
        with:
          version: 11.19.0
          runtime: node@22.22.0
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - name: Verify toolchain versions
        shell: bash
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(pnpm --version)" = "11.19.0"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Test public-data validator
        run: pnpm run validate:data:test

      - name: Validate bundled public data
        run: pnpm run validate:data

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build optimized demo bundle
        run: pnpm run build

      - name: Smoke-test built demo server and static routes
        shell: bash
        run: |
          pnpm run start --hostname 127.0.0.1 --port 3000 \
            > "${{ runner.temp }}/skypulse-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ \
              > "${{ runner.temp }}/skypulse-home.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat "${{ runner.temp }}/skypulse-server.log"
            exit 1
          fi
          grep -q "SkyPulse" "${{ runner.temp }}/skypulse-home.html"
          curl --fail --silent --show-error http://127.0.0.1:3000/glossary >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/methodology >/dev/null
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Reject generated source changes
        working-directory: .
        shell: bash
        run: |
          git diff --exit-code
          status=$(git status --porcelain --untracked-files=all)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
