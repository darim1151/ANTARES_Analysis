name: Python CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/linux-lock.yml"
      - "environment.yml"
      - "notebooks/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/linux-lock.yml"
      - "environment.yml"
      - "notebooks/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is retained as an EOL compatibility lane only. Pip
          # 26.0.1 is its final compatible release; production uses 3.11.
          - python-version: "3.9.25"
            pip-version: "26.0.1"
            use-linux-lock: false
          - python-version: "3.10.21"
            pip-version: "26.1.2"
            use-linux-lock: false
          - python-version: "3.11.16"
            pip-version: "26.1.2"
            use-linux-lock: true
    env:
      ANTARES_ANALYSIS_DATA_ROOT: ${{ runner.temp }}/antares-analysis-data
      ANTARES_ANALYSIS_CACHE_ROOT: ${{ runner.temp }}/antares-analysis-cache
      ANTARES_STORAGE_POLICY: private
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_INDEX_URL: https://pypi.org/simple
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.use-linux-lock }}" == "true" && \
                -f requirements/test-py311-linux-x86_64.lock ]]; then
            python -m pip install \
              --only-binary=:all: \
              --require-hashes \
              -r requirements/release-tools-py311-linux-x86_64.lock
            python -m pip install \
              --no-build-isolation \
              --only-binary=:all: \
              --no-binary=bson \
              --require-hashes \
              -r requirements/test-py311-linux-x86_64.lock
            python -m pip install --no-build-isolation --no-deps -e .
          else
            python -m pip install --upgrade "pip==${{ matrix.pip-version }}"
            python -m pip install -e '.[test]'
          fi
          python -m pip check

      - name: Compile supported Python sources
        run: python -m compileall -q src scripts tests

      - name: Verify metadata-only CLI isolation
        shell: bash
        run: |
          ANTARES_STORAGE_POLICY=intentionally-invalid \
            python -m src.cli --version

      - name: Run repository integration suite
        run: python -m unittest discover -s tests -v

      - name: Confirm configured roots were not created
        shell: bash
        run: |
          test ! -e "$ANTARES_ANALYSIS_DATA_ROOT"
          test ! -e "$ANTARES_ANALYSIS_CACHE_ROOT"

  wheel:
    name: Reproducible distributions and installed package
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ANTARES_ANALYSIS_DATA_ROOT: ${{ runner.temp }}/antares-analysis-data
      ANTARES_ANALYSIS_CACHE_ROOT: ${{ runner.temp }}/antares-analysis-cache
      ANTARES_STORAGE_POLICY: private
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_INDEX_URL: https://pypi.org/simple
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set deterministic build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build distributions twice from clean source trees
        shell: bash
        run: |
          if [[ -f requirements/release-tools-py311-linux-x86_64.lock ]]; then
            python -m pip install \
              --only-binary=:all: \
              --require-hashes \
              -r requirements/release-tools-py311-linux-x86_64.lock
          else
            python -m pip install --upgrade pip==26.1.2
            python -m pip install \
              build==1.4.4 \
              setuptools==83.0.0 \
              wheel==0.45.1
          fi
          mkdir -p \
            "${{ runner.temp }}/source-a" \
            "${{ runner.temp }}/source-b" \
            "${{ runner.temp }}/dist-a" \
            "${{ runner.temp }}/dist-b" \
            "${{ runner.temp }}/sdist-wheel"
          git archive --format=tar --output="${{ runner.temp }}/source.tar" HEAD
          tar -xf "${{ runner.temp }}/source.tar" -C "${{ runner.temp }}/source-a"
          tar -xf "${{ runner.temp }}/source.tar" -C "${{ runner.temp }}/source-b"
          python -m build \
            --no-isolation \
            --outdir "${{ runner.temp }}/dist-a" \
            "${{ runner.temp }}/source-a"
          python -m build \
            --no-isolation \
            --outdir "${{ runner.temp }}/dist-b" \
            "${{ runner.temp }}/source-b"
          python scripts/verify_python_distributions.py \
            --wheel-a "${{ runner.temp }}"/dist-a/*.whl \
            --wheel-b "${{ runner.temp }}"/dist-b/*.whl \
            --sdist-a "${{ runner.temp }}"/dist-a/*.tar.gz \
            --sdist-b "${{ runner.temp }}"/dist-b/*.tar.gz \
            --source-root "$GITHUB_WORKSPACE"
          python -m pip wheel \
            --no-build-isolation \
            --no-deps \
            --no-index \
            --wheel-dir "${{ runner.temp }}/sdist-wheel" \
            "${{ runner.temp }}"/dist-a/*.tar.gz
          cmp \
            "${{ runner.temp }}"/dist-a/*.whl \
            "${{ runner.temp }}"/sdist-wheel/*.whl
          sha256sum \
            "${{ runner.temp }}"/dist-a/* \
            "${{ runner.temp }}"/dist-b/* \
            "${{ runner.temp }}"/sdist-wheel/*

      - name: Inspect distribution structure and metadata
        shell: bash
        run: |
          python -m zipfile --test "${{ runner.temp }}"/dist-a/*.whl
          tar -tzf "${{ runner.temp }}"/dist-a/*.tar.gz >/dev/null
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("${{ runner.temp }}/dist-a").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata = [name for name in names if name.endswith(".dist-info/METADATA")]
              entry_points = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert len(metadata) == 1, metadata
              assert len(entry_points) == 1, entry_points
              text = archive.read(entry_points[0]).decode("utf-8")
              assert "antares-analysis = src.cli:main" in text
          PY

      - name: Locate the single built wheel
        id: wheel
        shell: bash
        run: |
          python -c 'from pathlib import Path; wheels = list(Path("${{ runner.temp }}/sdist-wheel").glob("*.whl")); assert len(wheels) == 1, wheels; print(f"path={wheels[0].resolve()}")' >> "$GITHUB_OUTPUT"

      - name: Install wheel into a fresh environment
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          if [[ -f requirements/test-py311-linux-x86_64.lock ]]; then
            "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install \
              --only-binary=:all: \
              --require-hashes \
              -r requirements/release-tools-py311-linux-x86_64.lock
            "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install \
              --no-build-isolation \
              --only-binary=:all: \
              --no-binary=bson \
              --require-hashes \
              -r requirements/test-py311-linux-x86_64.lock
            "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install \
              --no-deps \
              '${{ steps.wheel.outputs.path }}'
          else
            "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install --upgrade pip==26.1.2
            "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install \
              '${{ steps.wheel.outputs.path }}[test]'
          fi
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip check

      - name: Verify installed package outside the source tree
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "${{ runner.temp }}/wheel-smoke/bin/antares-analysis" --version
          ANTARES_STORAGE_POLICY=intentionally-invalid \
            "${{ runner.temp }}/wheel-smoke/bin/antares-analysis" --version
          "${{ runner.temp }}/wheel-smoke/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/verify_installed_package.py" \
            --forbid-root "$GITHUB_WORKSPACE"

      - name: Run repository integration suite against the wheel environment
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "${{ runner.temp }}/wheel-smoke/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -v
          test ! -e "$ANTARES_ANALYSIS_DATA_ROOT"
          test ! -e "$ANTARES_ANALYSIS_CACHE_ROOT"
