[build-system]
requires = [
    "setuptools==80.9.0; python_version < '3.10'",
    "setuptools==83.0.0; python_version >= '3.10'",
    "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "antares-analysis"
version = "0.3.0"
description = "Portable ANTARES/LSST nightly analysis and comparison workflows"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "antares-client==1.14.0",
    "astropy==6.0.1",
    "matplotlib==3.9.4",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel==6.31.0",
    "ipython==8.18.1",
    "nbformat==5.10.4",
]
test = [
    "nbformat==5.10.4",
]
dev = [
    "build==1.4.4",
    "ipykernel==6.31.0",
    "ipython==8.18.1",
    "nbformat==5.10.4",
    "pip-tools==7.6.0",
    "setuptools==80.9.0; python_version < '3.10'",
    "setuptools==83.0.0; python_version >= '3.10'",
    "wheel==0.45.1",
]

[project.scripts]
antares-analysis = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.operations"]
